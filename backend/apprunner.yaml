version: 1.0
runtime: nodejs22
build:
  commands:
    pre-build:
      - npm install
    build:
      - npm run build
run:
  command: npm run start
  network:
    port: 8080
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: HOST
      value: 0.0.0.0
    - name: DATABASE_SSL
      value: "true"
    - name: CORS_ALLOWED_ORIGINS
      value: https://rubh.com,https://www.rubh.com
  secrets:
    - name: DATABASE_URL
      value-from: /rubh/prod/database_url
    - name: INTERNAL_API_TOKEN
      value-from: /rubh/prod/internal_api_token
    - name: SUMSUB_WEBHOOK_SECRET
      value-from: /rubh/prod/sumsub_webhook_secret
    - name: SUMSUB_APP_TOKEN
      value-from: /rubh/prod/sumsub_app_token
    - name: SUMSUB_SECRET_KEY
      value-from: /rubh/prod/sumsub_secret_key
    - name: KYC_HMAC_KEY
      value-from: /rubh/prod/kyc_hmac_key
    - name: ADMIN_ALLOWLIST
      value-from: /rubh/prod/admin_allowlist
    - name: MERCHANT_ALLOWLIST
      value-from: /rubh/prod/merchant_allowlist
    - name: COMPLIANCE_ALLOWLIST
      value-from: /rubh/prod/compliance_allowlist
